name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the wheel ships the UI
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "gpd3303s/web/index.html",
              "gpd3303s/web/app.js",
              "gpd3303s/web/chart.js",
              "gpd3303s/web/style.css",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"{wheel} contains the full UI")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  installer:
    name: Installer smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the script parses
        run: sh -n install.sh

      - name: Install from this checkout
        env:
          GPD3303S_SPEC: ${{ github.workspace }}
          GPD3303S_BIN_DIR: ${{ runner.temp }}/bin
          GPD3303S_VENV_DIR: ${{ runner.temp }}/venv
        run: sh install.sh

      - name: Launcher works
        run: |
          # Which branch of the installer ran (uv, pipx or venv) decides where
          # the launcher lands, so record it alongside the result.
          echo "install method: $(cat "${HOME}/.local/share/gpd3303s-control/install-method" 2>/dev/null \
            || cat "${HOME}/Library/Application Support/gpd3303s-control/install-method" 2>/dev/null \
            || echo unknown)"
          "${{ runner.temp }}/bin/gpd3303s" --version
          "${{ runner.temp }}/bin/gpd3303s" --list-ports

  installer-windows:
    name: Installer smoke test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"
