name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/gpd3303s/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match __version__ $VERSION"
            exit 1
          fi
          echo "Releasing $TAG"

      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build distributions
        run: python -m build

      # The self-contained app: Python, Qt and the code in one file. This is
      # what makes "download and run it" possible without pip, a virtualenv or
      # anything on PATH -- the three things that let an old build keep running.
      - name: Build the standalone Linux app
        run: |
          python -m pip install pyinstaller
          PYTHON=python ./packaging/build-linux-app.sh
          mv dist/GPD-Control dist/GPD-Control-x86_64

      - name: Check the standalone app runs and is the native build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          chmod +x dist/GPD-Control-x86_64
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # env -i proves it needs nothing from this runner: no python, no PATH.
          got=$(env -i HOME="$HOME" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen \
            ./dist/GPD-Control-x86_64 --version)
          echo "standalone app reports: $got"
          [ "$got" = "gpd3303s-control ${TAG#v}" ] || {
            echo "::error::standalone app reports '$got', expected 'gpd3303s-control ${TAG#v}'"
            exit 1
          }
          env -i HOME="$HOME" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen \
            ./dist/GPD-Control-x86_64 --doctor | tee doctor.txt
          grep -q "native Qt widgets" doctor.txt || {
            echo "::error::the standalone app is not the native build"; exit 1; }
          grep -q "retired web build" doctor.txt && {
            echo "::error::the standalone app carries the retired web build"; exit 1; }
          echo "standalone app verified"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<NOTES
          ## Download the app (Linux)

          Grab **GPD-Control-x86_64** below, then:

          \`\`\`sh
          chmod +x GPD-Control-x86_64
          ./GPD-Control-x86_64
          \`\`\`

          That one file contains Python, Qt and the app. Nothing is installed,
          nothing goes on your PATH, and it cannot be shadowed by an older copy.

          ## Or install it

          **Linux / macOS**
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$REPO/main/install.sh | sh
          \`\`\`

          **Windows (PowerShell)**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/$REPO/main/install.ps1 | iex
          \`\`\`

          Already installed? The app will offer this update on its own, or run
          \`gpd3303s --update\`.
          NOTES

          # Uploaded with gh, which sends assets one at a time.
          # softprops/action-gh-release uploads them concurrently and its shared
          # asset temp dir races whenever more than one file matches, which is
          # what left v1.0.0 a draft carrying only the sdist.
          #
          # Written to be idempotent so a re-run repairs a half-published
          # release rather than failing on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating it"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md
          fi

      - name: Verify the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # The previous failure still produced a release, just an incomplete
          # one, so success is asserted rather than assumed.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          echo "Attached assets:"
          echo "$assets" | sed 's/^/  /'

          echo "$assets" | grep -q '\.whl$' || {
            echo "::error::release $TAG has no wheel attached"; exit 1; }
          echo "$assets" | grep -q '\.tar\.gz$' || {
            echo "::error::release $TAG has no sdist attached"; exit 1; }
          echo "$assets" | grep -q '^GPD-Control-x86_64$' || {
            echo "::error::release $TAG has no standalone Linux app attached"; exit 1; }

          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::release $TAG is still a draft"; exit 1
          fi

          echo "Release $TAG is published with the wheel, the sdist and the standalone app."
