name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/gpd3303s/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match __version__ $VERSION"
            exit 1
          fi
          echo "Releasing $TAG"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install

            **Linux / macOS**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            Already installed? The app will offer this update on its own, or run
            `gpd3303s --update`.
