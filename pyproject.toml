[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpd3303s-control"
# Single-sourced from src/gpd3303s/__init__.py. Duplicating it here once meant
# the tag said 1.1.0, the module said 1.1.0, and the built wheel said 1.0.0.
dynamic = ["version"]
description = "A native desktop control panel for GW Instek GPD-series programmable DC power supplies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GPD-3303S Control contributors" }]
keywords = ["gwinstek", "gpd-3303s", "power-supply", "scpi", "serial", "instrument"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "pyserial>=3.5",
  "PySide6-Essentials>=6.5",
  "packaging>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gpd3303s = "gpd3303s.cli:main"

[project.urls]
Homepage = "https://github.com/nomad9021/GPD-3303S-PSU-Control"
Issues = "https://github.com/nomad9021/GPD-3303S-PSU-Control/issues"

[tool.hatch.version]
path = "src/gpd3303s/__init__.py"

[tool.hatch.build.targets.sdist]
# A contributor's virtualenv living in the tree must not end up in the sdist;
# hatchling follows its symlinks out of the source tree and the build fails.
exclude = [".venv*", "venv", "build", "dist", ".github", "packaging/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/gpd3303s"]
# The window icon is data, not code, so it needs naming explicitly.
artifacts = ["src/gpd3303s/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
